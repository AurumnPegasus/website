<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Electromechanical relay</title>
<desc>A weak input loop on the left drives a copper coil wound around an iron core. The energized electromagnet pulls down a pivoted iron armature, whose tip closes contacts that complete a separate strong output loop on the right containing a big battery and a lamp.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.lbl { font-size: 12.5px; fill: #555555; }
.hdr { font-size: 13.5px; font-weight: 600; fill: #2b2b2b; }
</style>
</defs>

<text class="lbl" x="130" y="184" text-anchor="middle">Weak current</text>
<text class="hdr" x="130" y="202" text-anchor="middle">Input loop</text>
<line x1="278" y1="218" x2="130" y2="218" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="130" y1="218" x2="130" y2="262" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="114" y1="262" x2="146" y2="262" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="122" y1="274" x2="138" y2="274" stroke="#3a3a3a" stroke-width="3"/>
<line x1="130" y1="274" x2="130" y2="282" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="130" y1="282" x2="278" y2="282" stroke="#3a3a3a" stroke-width="1.5"/>

<rect x="292" y="205" width="32" height="85" rx="2" fill="#e9e6e1" stroke="#3a3a3a" stroke-width="0.75"/>
<ellipse cx="308" cy="218" rx="30" ry="5" fill="none" stroke="#BA7517" stroke-width="2"/>
<ellipse cx="308" cy="234" rx="30" ry="5" fill="none" stroke="#BA7517" stroke-width="2"/>
<ellipse cx="308" cy="250" rx="30" ry="5" fill="none" stroke="#BA7517" stroke-width="2"/>
<ellipse cx="308" cy="266" rx="30" ry="5" fill="none" stroke="#BA7517" stroke-width="2"/>
<ellipse cx="308" cy="282" rx="30" ry="5" fill="none" stroke="#BA7517" stroke-width="2"/>
<text class="hdr" x="308" y="318" text-anchor="middle">Electromagnet</text>
<text class="lbl" x="308" y="334" text-anchor="middle">copper coil, iron core</text>

<text class="lbl" x="300" y="128" text-anchor="middle">Armature (iron lever)</text>
<line x1="300" y1="134" x2="300" y2="156" stroke="#999999" stroke-width="1" stroke-dasharray="2 3"/>
<path d="M200 150 L192 162 L208 162 Z" fill="#3a3a3a"/>
<text class="lbl" x="200" y="178" text-anchor="middle">pivot</text>
<line x1="200" y1="150" x2="430" y2="172" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>

<line x1="350" y1="170" x2="350" y2="200" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="lbl" x="336" y="194" text-anchor="end">pulled down when coil is on</text>

<rect x="424" y="176" width="12" height="6" rx="1" fill="#3a3a3a"/>
<text class="lbl" x="444" y="170">Contacts close</text>

<text class="hdr" x="600" y="120" text-anchor="end">Strong output loop</text>
<path d="M200 150 L200 80 L620 80 L620 200" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="604" y1="200" x2="636" y2="200" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="612" y1="212" x2="628" y2="212" stroke="#3a3a3a" stroke-width="3"/>
<text class="lbl" x="596" y="208" text-anchor="end">Big battery</text>
<line x1="620" y1="212" x2="620" y2="264" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="620" cy="280" r="16" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="609" y1="269" x2="631" y2="291" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="631" y1="269" x2="609" y2="291" stroke="#3a3a3a" stroke-width="1.5"/>
<text class="lbl" x="596" y="284" text-anchor="end">Lamp / load</text>
<path d="M620 296 L620 365 L430 365 L430 182" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
</svg>
